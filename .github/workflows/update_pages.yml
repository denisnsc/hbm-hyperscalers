name: Refresh Market Data & Update GitHub Pages

on:
  schedule:
    # Runs every weekday at 22:15 UTC (after US market close)
    - cron: "15 22 * * 1-5"
  workflow_dispatch: # Allows manual 1-click refresh from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest market data and rebuild index.html
        run: python update_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard.html portfolio_data.json
          git diff --staged --quiet || (git commit -m "chore: refresh HBM & Hyperscalers market data" && git push)
